apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - base
replacements:
  - source:
      kind: ConfigMap
      name: dialer-network-values
      fieldPath: data.TRUNK_SIGNAL_CIDR_PRIMARY
    targets:
      - select:
          kind: NetworkPolicy
          name: allow-carrier-ingress
        fieldPaths:
          - spec.ingress.0.from.0.ipBlock.cidr
      - select:
          kind: NetworkPolicy
          name: allow-engine-egress
        fieldPaths:
          - spec.egress.3.to.0.ipBlock.cidr
  - source:
      kind: ConfigMap
      name: dialer-network-values
      fieldPath: data.TRUNK_SIGNAL_CIDR_SECONDARY
    targets:
      - select:
          kind: NetworkPolicy
          name: allow-carrier-ingress
        fieldPaths:
          - spec.ingress.0.from.1.ipBlock.cidr
      - select:
          kind: NetworkPolicy
          name: allow-engine-egress
        fieldPaths:
          - spec.egress.3.to.1.ipBlock.cidr
  - source:
      kind: ConfigMap
      name: dialer-network-values
      fieldPath: data.TRUNK_MEDIA_CIDR
    targets:
      - select:
          kind: NetworkPolicy
          name: allow-carrier-ingress
        fieldPaths:
          - spec.ingress.1.from.0.ipBlock.cidr
      - select:
          kind: NetworkPolicy
          name: allow-engine-egress
        fieldPaths:
          - spec.egress.4.to.0.ipBlock.cidr
  - source:
      kind: ConfigMap
      name: dialer-safety-status
      fieldPath: data.BACKUP_STATUS
    targets:
      - select:
          kind: CronJob
          name: postgres-logical-backup
        fieldPaths:
          - metadata.annotations.[voice-dialer.obvious.tech/backup-status]
