apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-snapshot-restore
  labels:
    app.kubernetes.io/name: dialer-postgres
    app.kubernetes.io/component: restore-staging
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  dataSource:
    name: postgres-manual-snapshot
    kind: VolumeSnapshot
    apiGroup: snapshot.storage.k8s.io
  resources:
    requests:
      storage: 20Gi
