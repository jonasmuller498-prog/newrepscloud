apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: voice-dialer
resources:
  - namespace.yaml
  - postgres/service.yaml
  - postgres/statefulset.yaml
  - postgres/pdb.yaml
  - postgres/backup-pvc.yaml
  - postgres/backup-cronjob.yaml
  - engine/service-headless.yaml
  - engine/service-app.yaml
  - engine/service-metrics.yaml
  - engine/media-pvc.yaml
  - engine/statefulset.yaml
  - engine/pdb.yaml
  - engine/service-sip.yaml
  - engine/rtp-32300-32319.yaml
  - engine/rtp-32320-32339.yaml
  - engine/rtp-32340-32359.yaml
  - engine/rtp-32360-32379.yaml
  - engine/rtp-32380-32399.yaml
  - engine/rtp-32400-32419.yaml
  - engine/rtp-32420-32439.yaml
  - engine/rtp-32440-32459.yaml
  - engine/rtp-32460-32479.yaml
  - engine/rtp-32480-32499.yaml
  - ingress.yaml
  - network/default-deny.yaml
  - network/app-ingress.yaml
  - network/acme-solver.yaml
  - network/carrier-ingress.yaml
  - network/engine-egress.yaml
  - network/database.yaml
configMapGenerator:
  - name: dialer-runtime
    envs:
      - config/app.env
  - name: dialer-network-values
    envs:
      - config/network.env.example
  - name: dialer-safety-status
    envs:
      - config/safety.env.example
  - name: asterisk-config
    files:
      - asterisk/asterisk.conf
      - asterisk/ari.conf
      - asterisk/extensions.conf
      - asterisk/http.conf
      - asterisk/logger.conf
      - asterisk/modules.conf
      - asterisk/pjsip.conf
      - asterisk/rtp.conf
  - name: dialer-build-scripts
    files:
      - scripts/build-app.sh
      - scripts/render-config.go
  - name: postgres-init
    files:
      - postgres/init-runtime.sh
generatorOptions:
  immutable: true
  labels:
    app.kubernetes.io/part-of: voice-dialer
labels:
  - pairs:
      app.kubernetes.io/part-of: voice-dialer
patches:
  - path: engine/statefulset-init.yaml
  - path: engine/statefulset-app.yaml
  - path: engine/statefulset-asterisk.yaml
