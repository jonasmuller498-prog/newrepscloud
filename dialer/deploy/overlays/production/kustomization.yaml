apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: voice-dialer
resources:
  - ../../base
configMapGenerator:
  - name: dialer-runtime
    behavior: replace
    envs:
      - inputs/runtime.env
  - name: dialer-network-values
    behavior: replace
    envs:
      - inputs/network.env
secretGenerator:
  - name: dialer-postgres
    behavior: replace
    envs:
      - inputs/postgres.env
  - name: dialer-app-secrets
    behavior: replace
    envs:
      - inputs/app.env
  - name: dialer-ari-secrets
    behavior: replace
    envs:
      - inputs/ari.env
  - name: dialer-trunk-secrets
    behavior: replace
    envs:
      - inputs/trunk.env
replacements:
  - source:
      kind: ConfigMap
      name: dialer-network-values
      fieldPath: data.INGRESS_NAMESPACE
    targets:
      - select:
          kind: NetworkPolicy
          name: allow-app-ingress
        fieldPaths:
          - spec.ingress.0.from.0.namespaceSelector.matchLabels.kubernetes\.io/metadata\.name
  - source:
      kind: ConfigMap
      name: dialer-network-values
      fieldPath: data.TRUNK_SIGNAL_CIDR
    targets:
      - select:
          kind: NetworkPolicy
          name: allow-voxbone-ingress
        fieldPaths:
          - spec.ingress.0.from.0.ipBlock.cidr
      - select:
          kind: NetworkPolicy
          name: allow-engine-egress
        fieldPaths:
          - spec.egress.3.to.0.ipBlock.cidr
  - source:
      kind: ConfigMap
      name: dialer-network-values
      fieldPath: data.TRUNK_MEDIA_CIDR
    targets:
      - select:
          kind: NetworkPolicy
          name: allow-voxbone-ingress
        fieldPaths:
          - spec.ingress.1.from.0.ipBlock.cidr
      - select:
          kind: NetworkPolicy
          name: allow-engine-egress
        fieldPaths:
          - spec.egress.4.to.0.ipBlock.cidr
