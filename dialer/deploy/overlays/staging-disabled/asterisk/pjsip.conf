[global]
type=global
user_agent=voice-dialer-asterisk/22.10.1
endpoint_identifier_order=ip,username
keep_alive_interval=90

[system]
type=system
timer_t1=500
timer_b=32000
compact_headers=no
threadpool_initial_size=10
threadpool_auto_increment=10
threadpool_idle_timeout=60
threadpool_max_size=150

; Carrier transport and routing are intentionally absent in staging-disabled.
