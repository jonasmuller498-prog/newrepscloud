apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-logical-backup
  annotations:
    voice-dialer.obvious.tech/backup-status: unconfigured-suspended
  labels:
    app.kubernetes.io/name: dialer-postgres
    app.kubernetes.io/component: postgres-maintenance
spec:
  schedule: "17 2 * * *"
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: dialer-postgres
            app.kubernetes.io/component: postgres-maintenance
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-dump
              image: postgres:17-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
              imagePullPolicy: IfNotPresent
              command: [sh, -ec]
              args:
                - |
                  umask 077
                  stamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  tmp="/backups/.dialer-${stamp}.dump.tmp"
                  out="/backups/dialer-${stamp}.dump"
                  trap 'rm -f "$tmp"' EXIT
                  pg_dump --format=custom --compress=9 --file="$tmp"
                  mv "$tmp" "$out"
                  find /backups -type f -name 'dialer-*.dump' -mtime +14 -delete
              envFrom:
                - configMapRef:
                    name: dialer-safety-status
              env:
                - name: PGHOST
                  value: postgres
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: dialer-postgres-runtime
                      key: DB_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: dialer-postgres-runtime
                      key: DB_PASSWORD
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: dialer-postgres-runtime
                      key: DB_NAME
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backups
            - name: tmp
              emptyDir: {}
