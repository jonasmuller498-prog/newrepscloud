apiVersion: v1
kind: Service
metadata:
  name: dialer-api
  labels:
    app.kubernetes.io/name: dialer-engine
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dialer-engine
  ports:
    - name: http
      port: 8080
      targetPort: api
      protocol: TCP
