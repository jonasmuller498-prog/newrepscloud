apiVersion: v1
kind: Service
metadata:
  name: dialer-sip
  labels:
    app.kubernetes.io/name: dialer-engine
    app.kubernetes.io/component: sip
spec:
  type: NodePort
  externalTrafficPolicy: Local
  ipFamilyPolicy: SingleStack
  ipFamilies: [IPv4]
  selector:
    app.kubernetes.io/name: dialer-engine
  ports:
    - name: sip-udp
      port: 31100
      targetPort: 31100
      nodePort: 31100
      protocol: UDP
