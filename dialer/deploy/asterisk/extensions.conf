[general]
static=yes
writeprotect=yes
clearglobalvars=no

[globals]
TRUNK_ENABLED=@@TRUNK_ENABLED@@
CAMPAIGN_FILE=/media/campaign
HARD_EXTERNAL_LIMIT=100

[reject-inbound]
exten => _.,1,Hangup(21)
exten => s,1,Hangup(21)
exten => i,1,Hangup(21)
exten => h,1,NoOp(Inbound channel rejected)

[dialer-app]
exten => _+1XXXXXXXXXX,1,NoOp(Restricted dialer request ${UNIQUEID})
 same => n,GotoIf($["${CHANNEL(channeltype)}"="Local"]?local:reject)
 same => n(local),GotoIf($["${DIALER_ORIGIN_TOKEN}"="@@ORIGIN_TOKEN@@"]?authorized:reject)
 same => n(authorized),GotoIf($["${TRUNK_ENABLED}"="true"]?enabled:paused)
 same => n(enabled),GotoIf($[${REGEX("^\+1[0-9]{10}$" ${EXTEN})}]?number_ok:reject)
 same => n(number_ok),GotoIf($[${STAT(e,${CAMPAIGN_FILE}.wav)}=1]?media_ok:no_media)
 same => n(media_ok),Set(GROUP(dialer)=dialer-external)
 same => n,GotoIf($[${GROUP_COUNT(dialer-external@dialer)} <= ${HARD_EXTERNAL_LIMIT}]?slot:capacity)
 same => n(slot),Set(__DIALER_DESTINATION=${EXTEN})
 same => n,Set(__DIALER_STATE=originating)
 same => n,Set(CALLERID(num)=@@CALLER_ID@@)
 same => n,Set(CALLERID(name)=@@CALLER_ID@@)
 same => n,Set(CALLERID(num-pres)=allowed_passed_screen)
 same => n,UserEvent(DialerOriginating,CallId:${UNIQUEID},Destination:${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@voxbone,60,U(dialer-campaign^s^1))
 same => n,Set(__DIALER_STATE=finished)
 same => n,UserEvent(DialerCompletion,CallId:${UNIQUEID},Destination:${EXTEN},Status:${DIALSTATUS})
 same => n,Hangup()
 same => n(paused),UserEvent(DialerRejected,CallId:${UNIQUEID},Reason:trunk_disabled)
 same => n,Hangup(21)
 same => n(no_media),UserEvent(DialerRejected,CallId:${UNIQUEID},Reason:media_missing)
 same => n,Hangup(21)
 same => n(capacity),UserEvent(DialerRejected,CallId:${UNIQUEID},Reason:hard_capacity)
 same => n,Hangup(34)
 same => n(reject),UserEvent(DialerRejected,CallId:${UNIQUEID},Reason:unauthorized_or_invalid)
 same => n,Hangup(21)
exten => _.,1,Hangup(21)
exten => h,1,NoOp(Dialer Local channel ended)

[dialer-campaign]
exten => s,1,Set(__DIALER_STATE=answered)
 same => n,UserEvent(DialerAnswer,CallId:${UNIQUEID},Destination:${DIALER_DESTINATION})
 same => n,Set(__DIALER_STATE=playing)
 same => n,UserEvent(DialerPlaybackStarted,CallId:${UNIQUEID})
 same => n,Background(${CAMPAIGN_FILE},,,dialer-dtmf)
 same => n,Set(__DIALER_STATE=completed)
 same => n,UserEvent(DialerPlaybackComplete,CallId:${UNIQUEID})
 same => n,Set(GOSUB_RESULT=CONTINUE)
 same => n,Return()

[dialer-dtmf]
exten => 9,1,Set(__DIALER_STATE=opt_out)
 same => n,Set(__DIALER_OPT_OUT=1)
 same => n,UserEvent(DialerOptOut,CallId:${UNIQUEID},Destination:${DIALER_DESTINATION},Digit:9)
 same => n,Set(GOSUB_RESULT=CONTINUE)
 same => n,Return()
