apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dialer-engine
  labels:
    app.kubernetes.io/name: dialer-engine
spec:
  serviceName: dialer-engine-headless
  replicas: 1
  revisionHistoryLimit: 3
  minReadySeconds: 10
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: dialer-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dialer-engine
        app.kubernetes.io/component: engine
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: runners
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: gcr.io/distroless/static-debian12:nonroot@sha256:f5b485ea962d9bd1186b2f6b3a061191539b905b82ec395de78cbfae51f20e35
        - name: asterisk
          image: andrius/asterisk:22.10.1_debian-trixie@sha256:e1c8eeb4daeaceeca7d8ed6f02c65011002e2d97365ee8a2fa7b0123559754c7
      volumes:
        - name: config-templates
          configMap:
            name: asterisk-config
        - name: scripts
          configMap:
            name: dialer-build-scripts
            defaultMode: 0555
        - name: rendered-config
          emptyDir:
            sizeLimit: 2Mi
        - name: app-bin
          emptyDir:
            sizeLimit: 64Mi
        - name: source
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: asterisk-run
          emptyDir:
            sizeLimit: 16Mi
        - name: asterisk-state
          emptyDir:
            sizeLimit: 64Mi
        - name: media
          persistentVolumeClaim:
            claimName: dialer-media
