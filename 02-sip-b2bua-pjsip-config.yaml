apiVersion: v1
kind: ConfigMap
metadata:
  name: asterisk-pjsip-config
  namespace: sip-b2bua
  labels:
    app.kubernetes.io/name: asterisk-b2bua
data:
  pjsip.conf: |
    [global]
    type=global
    max_forwards=70
    user_agent=Obvious SIP B2BUA
    endpoint_identifier_order=ip,anonymous

    [transport-udp]
    type=transport
    protocol=udp
    bind=0.0.0.0:32061
    external_signaling_address=51.255.71.124
    external_signaling_port=32061
    external_media_address=51.255.71.124
    local_net=10.42.0.0/16
    local_net=10.43.0.0/16

    [transport-tcp]
    type=transport
    protocol=tcp
    bind=0.0.0.0:32061
    external_signaling_address=51.255.71.124
    external_signaling_port=32061
    external_media_address=51.255.71.124
    local_net=10.42.0.0/16
    local_net=10.43.0.0/16

    [voxbone]
    type=endpoint
    transport=transport-udp
    context=from-voxbone
    disallow=all
    allow=ulaw,alaw
    direct_media=no
    rtp_symmetric=yes
    force_rport=yes
    rewrite_contact=yes
    rtp_timeout=60
    rtp_timeout_hold=300
    dtmf_mode=rfc4733
    max_audio_streams=1
    max_video_streams=0
    trust_id_inbound=yes

    [voxbone-ip1]
    type=identify
    endpoint=voxbone
    match=81.201.82.45

    [voxbone-ip2]
    type=identify
    endpoint=voxbone
    match=81.201.83.45

    [voxbone-ip3]
    type=identify
    endpoint=voxbone
    match=81.201.84.195

    [voxbone-ip4]
    type=identify
    endpoint=voxbone
    match=81.201.85.45

    [voxbone-ip5]
    type=identify
    endpoint=voxbone
    match=81.201.86.45

    ; Temporary fallback until the current Voxbone source ranges are observed.
    ; The dialplan still permits only the configured DID and fixed IVR target.
    [anonymous]
    type=endpoint
    transport=transport-udp
    context=from-voxbone
    disallow=all
    allow=ulaw,alaw
    direct_media=no
    rtp_symmetric=yes
    force_rport=yes
    rewrite_contact=yes
    rtp_timeout=60
    rtp_timeout_hold=300
    dtmf_mode=rfc4733
    max_audio_streams=1
    max_video_streams=0

    [ivr]
    type=endpoint
    transport=transport-udp
    context=from-ivr
    disallow=all
    allow=ulaw,alaw
    direct_media=no
    rtp_symmetric=yes
    force_rport=yes
    rewrite_contact=yes
    rtp_timeout=60
    rtp_timeout_hold=300
    dtmf_mode=rfc4733
    max_audio_streams=1
    max_video_streams=0
    send_pai=yes
    trust_id_outbound=yes
    aors=ivr

    [ivr]
    type=aor
    contact=sip:2.24.198.63:10069
    qualify_frequency=30
    qualify_timeout=3

    [ivr-ip]
    type=identify
    endpoint=ivr
    match=2.24.198.63
