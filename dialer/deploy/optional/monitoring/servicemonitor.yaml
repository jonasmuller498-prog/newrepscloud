apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dialer
  labels:
    app.kubernetes.io/name: dialer-engine
spec:
  namespaceSelector:
    matchNames:
      - voice-dialer
  selector:
    matchLabels:
      app.kubernetes.io/name: dialer-engine
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      path: /metrics
      scheme: http
      interval: 30s
      scrapeTimeout: 10s
